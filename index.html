<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Houseline</title>
  <meta name="theme-color" content="#2f5d3a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Houseline">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="styles-views.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <h1 class="sr-only">Houseline</h1>
  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <path d="M16 3.5 3.5 14.2h3.2v10.6h18.6V14.2h3.2z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="m11.4 18.6 3.2 3.2 6.2-6.8" fill="none" stroke="var(--logo-check)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3.5 28.2h25" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <div>
          <h1>Houseline</h1>
          <p class="tagline">Keep the house, car, yard and family ready.</p>
        </div>
      </div>
      <div class="header-actions" id="header-actions">
        <button type="button" class="btn primary" id="add-btn">+ Add task</button>
        <button type="button" class="btn" id="settings-btn" aria-haspopup="dialog">Settings</button>
      </div>
    </div>
  </header>

  <div id="app" hidden>
    <div class="wrap">
      <section id="today-strip" class="today-strip" aria-label="Today"></section>
    </div>
    <nav id="nav" class="main-nav" aria-label="Sections"></nav>
    <main id="main" class="wrap" tabindex="-1"></main>
  </div>
  <div id="wizard" class="wrap" hidden></div>

  <div class="status" id="status" role="status" aria-live="polite" aria-atomic="false"></div>

  <dialog id="task-dialog" aria-labelledby="task-dialog-title"></dialog>
  <dialog id="complete-dialog" aria-labelledby="complete-dialog-title"></dialog>
  <dialog id="settings-dialog" aria-labelledby="settings-dialog-title"></dialog>
  <dialog id="confirm-dialog" aria-labelledby="confirm-dialog-title"></dialog>

  <noscript><p class="wrap">This app needs JavaScript turned on.</p></noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
